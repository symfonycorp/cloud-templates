requirements:

template: |
    name: {{.Slug}}

    type: php:{{.PhpVersion}}

    build:
        flavor: none

    # Static websites usually don't require many resources. See
    # https://fixed.docs.upsun.com/create-apps/flexible-resources.html
    # for more information
    size: XS
    resources:
        base_memory: 64
        memory_ratio: 128

    disk: 1024

    web:
        commands:
            start: sleep
        locations:
            "/":
                root: "{{.PublicDirectory}}"
                index:
                    - "index.html"
                scripts: false
                expires: 10m
